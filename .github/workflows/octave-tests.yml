name: Octave offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Protocol tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave

      - name: Report runtime version
        run: octave --version

      # MockSerial exercises both wire modes without USB or instrument-control.
      # Uncaught Octave assertions must propagate a nonzero exit status.
      - name: Run offline protocol tests
        timeout-minutes: 5
        run: octave --no-gui --quiet --no-init-file --no-site-file tests/run_tests.m

      - name: Build installable package
        run: octave --no-gui --quiet --no-init-file --no-site-file scripts/build_package.m

      - name: Test isolated package lifecycle
        timeout-minutes: 5
        env:
          # Exercise first-use configuration, not a pre-existing user registry.
          XDG_CONFIG_HOME: ${{ runner.temp }}/esp-ts-clean-config
        run: octave --no-gui --quiet --no-init-file --no-site-file tests/test_package.m

      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octave-package
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
